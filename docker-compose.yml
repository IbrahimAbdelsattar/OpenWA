version: '3.8'

services:
  # ===== PostgreSQL 16 Database =====
  postgres:
    image: postgres:16-alpine
    container_name: openwa-postgres
    restart: unless-stopped
    networks:
      - openwa-network
    security_opt:
      - 'no-new-privileges:true'
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-openwa}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-openwa_super_secret_pass_2026}
      POSTGRES_DB: ${DATABASE_NAME:-openwa}
      POSTGRES_SCHEMA: ${POSTGRES_SCHEMA:-public}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init-schema.sh:/docker-entrypoint-initdb.d/01-create-schema.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USERNAME:-openwa}']
      interval: 5s
      timeout: 3s
      retries: 5
    labels:
      - 'com.openwa.service=database'
      - 'com.openwa.builtin=true'

  # ===== OpenWA Backend API & React Dashboard =====
  openwa-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: openwa-api
    restart: unless-stopped
    stop_grace_period: 75s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - openwa-network
      - dokploy-network
    security_opt:
      - 'no-new-privileges:true'
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    read_only: true
    tmpfs:
      - /tmp
    pids_limit: ${OPENWA_PIDS_LIMIT:-2048}
    mem_limit: ${OPENWA_MEM_LIMIT:-2g}
    ports:
      - '2785:2785'
    expose:
      - '2785'
    env_file:
      - path: .env
        required: false
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - TZ=UTC
      - HOME=/tmp
      - XDG_CONFIG_HOME=/tmp/.config
      - XDG_CACHE_HOME=/tmp/.cache
      - PORT=2785
      - LOG_LEVEL=info
      
      # Database Configuration
      - DATABASE_TYPE=${DATABASE_TYPE:-postgres}
      - DATABASE_HOST=${DATABASE_HOST:-postgres}
      - DATABASE_PORT=${DATABASE_PORT:-5432}
      - DATABASE_NAME=${DATABASE_NAME:-openwa}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-openwa}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-openwa_super_secret_pass_2026}
      - POSTGRES_SCHEMA=${POSTGRES_SCHEMA:-public}
      - DATABASE_SYNCHRONIZE=false

      # Engine Configuration
      - ENGINE_TYPE=${ENGINE_TYPE:-whatsapp-web.js}
      - SESSION_DATA_PATH=/app/data/sessions
      - PUPPETEER_HEADLESS=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/local/bin/puppeteer-chrome
      - WWEBJS_AUTH_TIMEOUT_MS=60000
      - AUTO_START_SESSIONS=true

      # Storage & Directories
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data/media
      - PLUGINS_DIR=/app/data/plugins
    volumes:
      - openwa-data:/app/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:2785/api/health/ready']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - 'com.openwa.service=api'
      - 'com.openwa.core=true'
      - 'traefik.enable=true'
      - 'traefik.http.routers.openwa.rule=Host(`wa.trio-academy.tech`)'
      - 'traefik.http.routers.openwa.entrypoints=websecure'
      - 'traefik.http.routers.openwa.tls=true'
      - 'traefik.http.routers.openwa.tls.certresolver=letsencrypt'
      - 'traefik.http.services.openwa.loadbalancer.server.port=2785'
      - 'traefik.docker.network=dokploy-network'

volumes:
  openwa-data:
    name: openwa_openwa-data
    driver: local
  postgres-data:
    name: openwa_postgres-data
    driver: local

networks:
  openwa-network:
    name: openwa-network
  dokploy-network:
    external: true
